- id: conventional-commits
  name: "Commit title must use Component: summary"
  entry: '\A(?![A-Za-z][A-Za-z0-9_.()/ -]*!?: \S)'
  language: pygrep
  args: [--multiline]
  always_run: true
  stages: [commit-msg]
- id: commit-title-length
  name: Commit title must not exceed 70 characters
  entry: '\A(?:[^\r\n\x80-\xBF][\x80-\xBF]*){71}'
  language: pygrep
  args: [--multiline]
  always_run: true
  stages: [commit-msg]
- id: commit-message-line-length
  name: Commit message lines must not exceed 100 characters
  entry: '\A(?:(?!# -{24} >8 -{24}\n)[^\n]*\n)*?(?!#)(?:[^\r\n\x80-\xBF][\x80-\xBF]*){101}'
  language: pygrep
  args: [--multiline]
  always_run: true
  stages: [commit-msg]
